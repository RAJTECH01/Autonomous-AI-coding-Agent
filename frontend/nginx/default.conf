# Static file server for the built SPA.
#
# This is the *inner* server. It only serves assets; it does not terminate TLS
# and does not know about /api. Public routing (TLS, / -> frontend,
# /api -> backend) belongs to the edge reverse proxy in deploy/reverse-proxy.
#
# Port 8080, not 80: nginx runs unprivileged here and cannot bind a port below
# 1024.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Container health probe. Never logged, so probes do not drown out traffic.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Hashed build assets (index-CKvOuzUd.js). The filename changes whenever the
    # content does, so these are safe to cache permanently.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached: it carries the references to the current
    # hashed assets. A cached copy pins clients to a deleted build.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # SPA history fallback: unknown paths render the app, which routes clientside.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api must never be answered here. Without this, a proxy misconfiguration
    # would fall through to the SPA fallback above and hand the browser HTML
    # where it expects JSON - a confusing failure. Fail loudly instead.
    location /api/ {
        add_header Content-Type application/json always;
        return 502 "{\"detail\":\"/api is not served by the frontend container; check the reverse proxy routing\"}\n";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml
                      application/xml+rss text/javascript image/svg+xml;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Deny dotfiles (.env, .git) if one ever lands in the web root.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

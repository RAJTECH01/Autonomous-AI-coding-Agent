###############################################################################
# Backend tooling configuration: ruff (format + lint), mypy, coverage.
#
# Packaging is intentionally not configured here - the app is deployed as a
# container, not published as a distribution, so there is no [build-system].
#
# ADOPTION MODEL - read this before widening any rule set
#   These tools were introduced onto an existing codebase that had never been
#   linted or formatted. Two levers keep the pipeline honest without a 100-file
#   mechanical rewrite landing in an unrelated pull request:
#
#   1. FORMATTING is enforced on changed files only. Every file a pull request
#      touches must be formatted; untouched legacy files are normalised as they
#      are next edited. 106 of 138 files currently differ from ruff format, so
#      enforcing repo-wide today would mean reformatting almost everything at
#      once. Run `ruff format app alembic tests` when the team wants to take that
#      step in a dedicated commit, then set the CI gate to repo-wide.
#
#   2. LINTING is split. The `select` list below is the mandatory, repo-wide
#      gate: rules that catch genuine bugs, and it passes cleanly today. The
#      wider modernisation set lives in the advisory CI job (see
#      [tool.ruff.lint.extend-select-advisory] note) so the outstanding debt is
#      measured on every run without blocking merges.
###############################################################################

[tool.ruff]
line-length = 100
target-version = "py311"

extend-exclude = [
    ".venv",
    "__pycache__",
    # Generated by `alembic revision --autogenerate`. Reformatting generated
    # migrations creates diff noise and re-running autogenerate would undo it.
    "alembic/versions",
]

[tool.ruff.lint]
# MANDATORY, repo-wide. Verified to produce zero findings on the current tree.
select = [
    "E4",    # import formatting errors
    "E7",    # statement-level errors (comparisons to None/True, bare semicolons)
    "E9",    # syntax and IO errors - a file ruff cannot parse
    "F63",   # nonsensical comparisons, e.g. `assert (a, b)` which is always true
    "F7",    # syntax misuse: break outside loop, return outside function
    "F82",   # undefined names - the classic NameError-at-runtime class
    "F811",  # redefinition of an unused name, which usually means a lost function
    "PLE",   # pylint errors: genuine mistakes, not style
    "B",     # flake8-bugbear: mutable defaults, misused asserts, loop bugs
    "T20",   # print/pprint left in application code (structlog is the logger)
]

ignore = [
    # --- FastAPI's core idiom, not a bug -----------------------------------
    # B008 flags function calls in default arguments. Every FastAPI dependency
    # is written `db: AsyncSession = Depends(get_db)`, which is exactly that
    # pattern and is correct. 42 occurrences, all legitimate.
    "B008",
    # --- Deliberate in tests ----------------------------------------------
    # B017 flags `pytest.raises(Exception)`. The suite uses it where the point is
    # that *something* fails, not which type. 7 occurrences.
    "B017",
    # B904 wants `raise ... from err` inside except blocks. The API deliberately
    # raises HTTPException without chaining so internal tracebacks are not
    # attached to client-facing errors.
    "B904",
]

# ---------------------------------------------------------------------------
# ADVISORY set, for the non-blocking quality job:
#
#   ruff check --extend-select I,F401,UP,SIM,RUF,C4,PIE,ASYNC,BLE app alembic tests
#
# Current debt, measured: UP006 368, UP045 346, UP035 151, F401 148, I001 120,
# BLE001 68, PIE790 35, RUF010 17, ASYNC230 6.
#
# ASYNC230 is the one worth prioritising: it flags blocking `open()` calls inside
# async functions in the sandbox adapter, which stall the event loop for every
# concurrent request. The rest are typing modernisation and import hygiene.
# ---------------------------------------------------------------------------

[tool.ruff.lint.per-file-ignores]
# E402 (import not at top of file) is deliberate in these three places, so it is
# silenced per file rather than globally - a new accidental violation elsewhere
# still fails the gate.
#
# conftest.py sets environment variables and sys.path before importing anything
# from `app`, because app.core.config reads the environment at import time.
"tests/conftest.py" = ["E402"]
# These two modules import late to break circular imports between entity modules.
"app/domain/entities/agent.py" = ["E402"]
"app/domain/entities/session.py" = ["E402"]

# SQLAlchemy relationship targets are string forward references
# (`Mapped["CodingTaskModel"]`) resolved by the declarative registry at mapper
# configuration time, not by the interpreter at import time. Ruff cannot follow
# that indirection and reports F821. Verified not a runtime error: `from
# app.main import app` imports the full model graph successfully.
"app/infrastructure/db/models/*.py" = ["F821"]

# Tests legitimately assert on private behaviour and use bare asserts.
"tests/**/*.py" = ["S101", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"          # the repo is edited on Windows; normalise on write
docstring-code-format = true


###############################################################################
# mypy
#
# Deliberately NOT --strict. This codebase has no annotations in large areas, so
# strict mode reports thousands of errors and a gate nobody can pass is a gate
# everybody routes around. The settings below catch the errors that cause
# runtime failures - bad attribute access, wrong argument types, unreachable
# branches - across the annotated surface, and the strictness is raised module by
# module in [[tool.mypy.overrides]] as annotations land.
###############################################################################

[tool.mypy]
python_version = "3.11"
files = ["app"]
exclude = '(^|/)(\.venv|alembic/versions|__pycache__)(/|$)'

# Several package directories have no __init__.py, so mypy's default module
# discovery maps app/domain/entities/git.py and app/api/v1/endpoints/git.py to the
# same module name "git" and aborts with "Duplicate module named git".
# These three settings make mypy derive full dotted paths from the source root
# instead, which resolves them as app.domain.entities.git and
# app.api.v1.endpoints.git.
mypy_path = "."
namespace_packages = true
explicit_package_bases = true

# --- What is checked --------------------------------------------------------
# Unannotated function bodies are skipped, so adding annotations to a function
# is what opts it in. This makes the ratchet automatic: new typed code is
# checked, legacy untyped code is not silently blessed.
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_return_any = false

no_implicit_optional = true
strict_equality = true
extra_checks = true

# --- Output ----------------------------------------------------------------
pretty = true
show_error_codes = true
show_column_numbers = true
# Third-party packages without type information must not fail the run.
ignore_missing_imports = true
follow_imports = "normal"

# SQLAlchemy 2.0 ships PEP 561 types; its Mapped[] plugin needs this to resolve
# declarative models correctly.
plugins = []

[[tool.mypy.overrides]]
# Pydantic and SQLAlchemy decorators/metaclasses generate attributes that mypy
# cannot see without their plugins, producing false positives on model classes.
module = [
    "app.infrastructure.db.models.*",
    "app.schemas.*",
    "app.core.config",
]
# name-defined covers the same SQLAlchemy string forward references that ruff
# reports as F821 - resolved by the declarative registry, invisible to static
# analysis.
disable_error_code = ["call-arg", "misc", "assignment", "name-defined"]

[[tool.mypy.overrides]]
# Vendor SDKs without usable type information. follow_imports = "skip" (rather
# than only ignore_missing_imports) makes mypy treat these modules as Any instead
# of partially analysing them and reporting attributes that exist at runtime -
# e.g. `docker.from_env` was reported as missing because the docker SDK ships no
# py.typed marker.
module = [
    "docker.*",
    "celery.*",
    "jose.*",
    "passlib.*",
    "anthropic.*",
    "openai.*",
    "google.*",
    "vcr.*",
    "prometheus_client.*",
    "structlog.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# TYPE DEBT BASELINE
#
# These modules have pre-existing type errors and are excluded so the gate can be
# mandatory for everything else - including every new module. This is a ratchet,
# not an amnesty: delete an entry, run mypy, fix what it reports.
#
# Counts measured at the time of writing (24 errors total). The dominant pattern
# is the subagents' structured-output helpers, which are annotated as returning
# pydantic `BaseModel` and then read concrete fields off it
# (`result.root_cause`). The fix is to annotate those helpers with the specific
# response models, which also gets real validation instead of duck typing.
#
# NOT excluded, and therefore enforced: app.main, app.worker.*, app.core.*,
# app.api.*, app.services.*, app.domain.*.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
    # 11 errors: subagent helpers returning bare BaseModel
    "app.application.agent.subagents.analyzer",
    "app.application.agent.subagents.coder",
    "app.application.agent.subagents.debugger",
    "app.application.agent.subagents.planner",
    # 2 errors: Optional[str] passed where str is required in add_tool_response.
    # This one is a latent bug worth fixing first - a None tool response would
    # reach the model as a literal "None".
    "app.application.agent.state_machine",
    # 1 error: mutable default typed as list but defaulting to None
    "app.application.agent.memory_manager",
    # 3 errors: stream_response declared async but implemented as an async
    # generator, so the declared and actual return types genuinely disagree
    "app.infrastructure.ai_providers.openai_adapter",
    "app.infrastructure.ai_providers.anthropic_adapter",
    # 4 errors: generic repository accesses ModelType.id without a bound
    "app.infrastructure.db.repositories.base",
    # 1 error: `sanitized` assigned in both branches of an os.name check
    "app.infrastructure.sandbox.policy",
]
ignore_errors = true


###############################################################################
# Coverage
###############################################################################

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/alembic/*",
    "*/tests/*",
    # Celery entrypoint: exercised by the smoke test's `inspect ping`, not by
    # unit tests, so counting it would understate real coverage.
    "app/worker/celery_app.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]

[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = strict
addopts = -ra --strict-markers
log_level = WARNING
log_cli = false
filterwarnings =
    ignore::DeprecationWarning

markers =
    unit: pure logic, no I/O, no event loop dependencies
    integration: real collaborators wired together (real filesystem, real DB, real tool layer)
    api: HTTP-level tests through the real FastAPI app
    database: real database engine, schema, constraints and transactions
    agent: agent state machine and orchestration behaviour
    tools: tool layer and individual tool contracts
    sandbox: sandbox isolation, limits and lifecycle
    authn: authentication
    authz: authorization and tenant isolation
    failure: failure injection, retry, timeout and degradation paths
    e2e: end-to-end flows across API + agent + tools + sandbox
    security: security controls and abuse cases
    vuln: asserts a secure behaviour that is currently NOT implemented (open finding)
    quarantine: known-failing test that encodes pre-hardening behaviour; excluded from the mandatory CI gate and tracked as test debt in docs/CICD.md
    slow: takes more than a second
    docker: requires a reachable Docker daemon
    postgres: requires a reachable PostgreSQL instance

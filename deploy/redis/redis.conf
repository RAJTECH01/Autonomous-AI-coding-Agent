################################################################################
# Redis configuration - Celery broker and result backend.
#
# Redis here is NOT a disposable cache. It holds the agent-run queue and beat's
# schedule state, so losing it loses queued work. The settings below are tuned
# for durability first, throughput second.
################################################################################

# --- Network -----------------------------------------------------------------
# Bind all interfaces *inside the container*; the port is never published to the
# host in production, so reachability is limited to the Compose network.
bind 0.0.0.0
port 6379
protected-mode yes

# Drop idle clients after 5 minutes. Celery reconnects transparently.
timeout 300
tcp-keepalive 300

# --- AUTHENTICATION: DELIBERATELY ABSENT -------------------------------------
# `requirepass` is NOT set, and enabling it here would break the application.
#
# app/core/config.py builds the connection string as:
#     REDIS_URL = f"redis://{REDIS_HOST}:{REDIS_PORT}/{REDIS_DB}"
# There is no REDIS_PASSWORD field and no place to inject credentials, so a
# password on the server would make every worker fail with NOAUTH.
#
# Redis is therefore protected only by network isolation: it sits on an internal
# Compose network with no published port. That is acceptable for a single-host
# deployment and NOT acceptable on a shared or multi-tenant network.
#
# To add authentication properly:
#   1. add REDIS_PASSWORD: Optional[str] to Settings
#   2. include it in the REDIS_URL property (redis://:PASSWORD@host:port/db)
#   3. set `requirepass` here from the same secret
# Tracked in docs/DEPLOYMENT.md "Residual risks".

# --- Persistence: AOF (primary) ----------------------------------------------
# AOF is the durable log. `everysec` fsyncs once per second, bounding worst-case
# loss to ~1 second of enqueued tasks. `always` would be safer but costs a
# synchronous disk write per command, which is not worth it for a task queue.
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec

# Do not skip fsync during rewrites: the gap is exactly when a crash is most
# likely to lose data.
no-appendfsync-on-rewrite no

# Rewrite when the log doubles, once it is at least 64mb.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Truncate a partially-written final command (a torn tail from a crash) and keep
# serving, instead of refusing to start.
aof-load-truncated yes
aof-use-rdb-preamble yes

# --- Persistence: RDB snapshots (secondary) ----------------------------------
# Kept alongside AOF because a compact point-in-time file is far easier to copy
# into a backup than a large AOF.
#   after 900s if >=1 key changed
#   after 300s if >=10 keys changed
#   after  60s if >=10000 keys changed
save 900 1
save 300 10
save 60 10000

# Refuse writes if a snapshot cannot be persisted: fail loudly rather than
# silently accept tasks that will not survive.
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# --- Memory ------------------------------------------------------------------
# Keep maxmemory meaningfully below the container's memory limit so the kernel
# OOM killer never fires. With a 512m container limit, 384m leaves room for
# copy-on-write during BGSAVE/AOF rewrite, which can transiently double usage.
maxmemory 384mb

# noeviction is the critical setting for a broker. Any `allkeys-*` policy would
# let Redis silently delete queued tasks under memory pressure - work would
# vanish with no error anywhere. With noeviction, writes fail loudly instead.
maxmemory-policy noeviction

# --- Dangerous commands ------------------------------------------------------
# Nothing in this system legitimately flushes the database or rewrites config at
# runtime, so remove the commands that could destroy the queue in one call.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command DEBUG ""

# --- Logging -----------------------------------------------------------------
# Empty logfile means stdout, which the container log driver collects.
logfile ""
loglevel notice

# --- Slow queries ------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

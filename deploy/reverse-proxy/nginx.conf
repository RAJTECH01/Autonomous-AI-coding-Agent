# Main nginx configuration for the edge reverse proxy.
#
# Built on nginxinc/nginx-unprivileged, so:
#   * there is no `user` directive (the process is already non-root, uid 101)
#   * the pid file and every temp path live under /tmp, which lets the container
#     run with a read-only root filesystem
#   * listeners bind 8080/8443, not 80/443, because an unprivileged process
#     cannot bind ports below 1024. Publish 80->8080 and 443->8443.

worker_processes auto;

# Match the container's file-descriptor budget rather than the host's.
worker_rlimit_nofile 8192;

error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept       on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Writable paths for an unprivileged, read-only-rootfs container -------
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # --- Logging -------------------------------------------------------------
    # JSON lines to stdout, matching the backend's structlog output, so one log
    # pipeline parses everything. escape=json prevents a crafted header or URI
    # from injecting a fake log record.
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"correlation_id":"$http_x_correlation_id",'
        '"request_id":"$request_id"'
        '}';

    access_log /dev/stdout json_combined;

    # --- Connection handling -------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Body limit. The API accepts prompts and JSON, not uploads; a low ceiling
    # cheaply rejects oversized payloads before they reach the app.
    client_max_body_size 10m;
    client_body_timeout  30s;
    client_header_timeout 30s;
    large_client_header_buffers 4 16k;

    # --- Rate limiting (first line of defence) -------------------------------
    # The application also rate-limits in-process (app/core/rate_limiter.py,
    # 10 requests / 60s), but that state is per-process and lost on restart.
    # Enforcing here protects the app before a request ever reaches Python.
    limit_req_zone  $binary_remote_addr zone=general:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m      rate=10r/s;
    # Login, refresh and password reset: brute-force surface, so far stricter.
    limit_req_zone  $binary_remote_addr zone=auth:10m     rate=12r/m;
    # Each agent session creation pulls a sandbox image and starts a container.
    limit_req_zone  $binary_remote_addr zone=sessions:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # --- Compression ---------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml
                      application/xml+rss text/javascript image/svg+xml;

    # --- Upstreams -----------------------------------------------------------
    # Compose service names, resolved on the app network.
    #
    # `keepalive` reuses upstream connections instead of opening a new one per
    # request. Note the single-server upstreams: the API cannot be scaled to
    # multiple replicas while agent-session state lives in process memory
    # (docs/DEPLOYMENT.md "Scaling constraints").
    upstream backend_api {
        server backend:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:8080 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    # WebSocket/upgrade passthrough. Harmless today (the UI polls over HTTP) and
    # required the moment session updates move to a socket.
    # Empty (not "close") for non-upgrade requests: an empty value makes nginx
    # omit the Connection header, which is what keeps the upstream keepalive
    # pool above alive. Sending "close" would defeat it on every request.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # --- Trusting client IPs from an upstream load balancer -------------------
    # DELIBERATELY DISABLED. If this proxy sits behind a cloud load balancer,
    # uncomment and set the CIDR to that balancer's range so $remote_addr, the
    # rate-limit keys and the audit logs record the real client.
    #
    # Enabling it with a too-wide range (or 0.0.0.0/0) lets any client spoof
    # X-Forwarded-For and bypass every limit_req zone above, so it must name the
    # balancer's addresses explicitly.
    #
    # set_real_ip_from  10.0.0.0/8;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}

# Shared routing for the HTTP-only (development) and TLS (production) server
# blocks. Ordering is irrelevant: nginx picks the longest matching prefix, so the
# specific /api/v1/... blocks always win over /api/ and /.

# --- Proxy's own health probe -----------------------------------------------
# Answered locally so it reports on the proxy, not on its upstreams.
location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
}

# --- Authentication: strictest limit ----------------------------------------
# Login, token refresh and password reset. The app also tracks brute-force
# attempts, but that counter is per-process memory and resets on deploy, so the
# durable limit belongs here.
location /api/v1/auth/ {
    limit_req  zone=auth burst=8 nodelay;
    limit_conn perip 20;

    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://backend_api;
}

# --- Agent session creation --------------------------------------------------
# POST /api/v1/sessions creates a sandbox container inline, which on a cold host
# includes pulling python:3.11-slim. That can take minutes, hence the long read
# timeout here versus 60s elsewhere.
location = /api/v1/sessions {
    limit_req  zone=sessions burst=5 nodelay;
    limit_conn perip 10;

    include /etc/nginx/snippets/proxy-common.conf;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://backend_api;
}

# --- Operational telemetry: internal networks only ---------------------------
# /api/v1/metrics, /metrics/dashboard and /metrics/background-jobs have no
# authentication dependency in the application. Exposing them publicly would
# leak run counts, token spend, error rates and job names. Restrict at the edge
# and scrape from inside the network.
location /api/v1/metrics {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;

    access_log off;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://backend_api;
}

# --- Everything else under /api ---------------------------------------------
location /api/ {
    limit_req  zone=api burst=20 nodelay;
    limit_conn perip 30;

    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://backend_api;
}

# --- Static SPA --------------------------------------------------------------
location / {
    limit_req  zone=general burst=50 nodelay;
    limit_conn perip 50;

    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://frontend_app;

    # Let the frontend container's own cache headers through untouched.
    proxy_cache_bypass $http_upgrade;
}

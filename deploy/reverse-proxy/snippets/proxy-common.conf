# Common proxy headers, shared by every proxied location.
#
# The backend runs uvicorn with --proxy-headers --forwarded-allow-ips='*', so it
# derives the client IP and scheme from what is set here. That is only safe
# because the backend port is never published: this proxy is the sole path in.

proxy_http_version 1.1;

# Required for the upstream keepalive pool (see the $connection_upgrade map).
proxy_set_header Connection        $connection_upgrade;
proxy_set_header Upgrade           $http_upgrade;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Correlation id: reuse the caller's if present, otherwise mint one from
# nginx's $request_id so a request can be traced across proxy, API and worker.
# CorrelationIdMiddleware on the backend reads this header.
proxy_set_header X-Correlation-ID  $http_x_correlation_id;
proxy_set_header X-Request-ID      $request_id;

# Never forward the raw hop-by-hop auth of the proxy itself.
proxy_set_header Proxy-Authorization "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Retry the next upstream only on connection-level failures. Retrying a
# non-idempotent POST (an agent run, a login) is not safe.
proxy_next_upstream error timeout;
proxy_redirect off;
